<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ConciliaBT — Conciliación Bancaria Banco del Tesoro, Tesorería y Contabilidad</title>
  <meta name="description" content="Conciliación bancaria en dos fases: Según Libros ↔ Mayor Analítico y Mayor Analítico ↔ Banco del Tesoro. Detección exacta de diferencias, duplicados y fallas del sistema." />
  <meta name="theme-color" content="#0f2942" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ConciliaBT" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 28 28" fill="none">
            <rect x="2" y="4" width="24" height="20" rx="4" stroke="currentColor" stroke-width="2"/>
            <path d="M7 14.5L11.5 19L21 9.5" stroke="#F87171" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">ConciliaBT</span>
          <span class="brand-sub">Banco del Tesoro · Empresa</span>
        </div>
      </div>

      <!-- Account & Period Selector -->
      <div class="context-box">
        <div class="context-row-hdr">
          <label for="accountSelect">Cuenta Bancaria</label>
          <button class="link-btn" id="btnNewAccount" title="Agregar nueva cuenta">+ Cuenta</button>
        </div>
        <select id="accountSelect" class="dark-select"></select>
        <div class="acct-meta" id="accountMeta">—</div>

        <div class="context-row-hdr mt-10">
          <label for="periodSelect">Período Mensual</label>
          <button class="link-btn" id="btnNewPeriod" title="Abrir nuevo período mensual">+ Período</button>
        </div>
        <select id="periodSelect" class="dark-select"></select>
      </div>

      <!-- Navigation -->
      <nav class="nav-list" aria-label="Navegación principal">
        <button class="nav-item active" data-view="resumen">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7">
            <rect x="2.5" y="2.5" width="6.5" height="6.5" rx="1.3"/><rect x="11" y="2.5" width="6.5" height="6.5" rx="1.3"/>
            <rect x="2.5" y="11" width="6.5" height="6.5" rx="1.3"/><rect x="11" y="11" width="6.5" height="6.5" rx="1.3"/>
          </svg>
          <span>Panel General</span>
        </button>

        <button class="nav-item" data-view="importar">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M10 13V3.5M10 3.5L6.5 7M10 3.5L13.5 7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M3 13.5V15.5C3 16.3 3.7 17 4.5 17H15.5C16.3 17 17 16.3 17 15.5V13.5" stroke-linecap="round"/>
          </svg>
          <span>Cargar PDFs</span>
        </button>

        <button class="nav-item" data-view="mesa">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M3 5.5H17M3 10H17M3 14.5H17" stroke-linecap="round"/>
            <circle cx="7" cy="5.5" r="1.6" fill="currentColor"/><circle cx="13" cy="10" r="1.6" fill="currentColor"/><circle cx="8.5" cy="14.5" r="1.6" fill="currentColor"/>
          </svg>
          <span>Mesa de Conciliación</span>
          <span class="nav-badge" id="badgePending" hidden>0</span>
        </button>

        <button class="nav-item" data-view="alertas">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M10 3L17.8 16.5H2.2L10 3Z" stroke-linejoin="round"/>
            <path d="M10 8V11.8" stroke-linecap="round"/><circle cx="10" cy="14.3" r="0.8" fill="currentColor"/>
          </svg>
          <span>Descuadres y Fallas</span>
          <span class="nav-badge warn" id="badgeAlerts" hidden>0</span>
        </button>

        <button class="nav-item" data-view="hoja">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M5 2.5H12.5L16 6V16.5C16 17.1 15.6 17.5 15 17.5H5C4.4 17.5 4 17.1 4 16.5V3.5C4 2.9 4.4 2.5 5 2.5Z"/>
            <path d="M7 10H13M7 13H13M7 7H10" stroke-linecap="round"/>
          </svg>
          <span>Hoja y Ajustes</span>
          <span class="nav-badge info" id="badgeAdj" hidden>0</span>
        </button>

        <button class="nav-item" data-view="config">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7">
            <circle cx="10" cy="10" r="2.8"/>
            <path d="M10 2.5V4.3M10 15.7V17.5M2.5 10H4.3M15.7 10H17.5M4.7 4.7L6 6M14 14L15.3 15.3M15.3 4.7L14 6M6 14L4.7 15.3" stroke-linecap="round"/>
          </svg>
          <span>Cuentas y Ajustes App</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="footer-note">Moneda base: <strong>Bolívares (Bs.)</strong></div>
        <div class="footer-sub">Triple cruce: Banco · Libros · Mayor</div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" id="btnMobileMenu" aria-label="Menú">
            <svg viewBox="0 0 20 20" width="20" height="20" stroke="currentColor" stroke-width="1.8" fill="none">
              <path d="M3 5H17M3 10H17M3 15H17" stroke-linecap="round"/>
            </svg>
          </button>
          <div>
            <div class="topbar-title-row">
              <h1 class="topbar-title" id="topbarTitle">Cargando…</h1>
              <span class="status-pill" id="periodStatusPill">—</span>
              <span class="balance-pill" id="balanceStatusPill">—</span>
            </div>
            <p class="topbar-sub" id="topbarSub">Conciliación bancaria y contable</p>
          </div>
        </div>

        <div class="topbar-actions" id="topbarActions">
          <button class="btn btn-secondary btn-sm" id="btnAutoReconcile" title="Ejecutar cruce inteligente automático">
            <svg viewBox="0 0 18 18" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M3 9A6 6 0 0 1 13.5 5M15 9A6 6 0 0 1 4.5 13" stroke-linecap="round"/>
              <path d="M11.5 5H14V2.5M6.5 13H4V15.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Autoconciliar (F1+F2)</span>
          </button>
          <button class="btn btn-secondary btn-sm" id="btnExportExcel" title="Descargar libro Excel completo (.xlsx)">
            <svg viewBox="0 0 18 18" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M9 2.5V11.5M9 11.5L5.8 8.3M9 11.5L12.2 8.3" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M3 13V14.5C3 15.1 3.4 15.5 4 15.5H14C14.6 15.5 15 15.1 15 14.5V13" stroke-linecap="round"/>
            </svg>
            <span>Excel</span>
          </button>
          <button class="btn btn-primary btn-sm" id="btnExportPdf" title="Descargar Acta de Conciliación en PDF para firmar">
            <svg viewBox="0 0 18 18" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M4.5 2.5H11L14.5 6V14.5C14.5 15.1 14.1 15.5 13.5 15.5H4.5C3.9 15.5 3.5 15.1 3.5 14.5V3.5C3.5 2.9 3.9 2.5 4.5 2.5Z"/>
              <path d="M6.5 9.5H11.5M6.5 12H10" stroke-linecap="round"/>
            </svg>
            <span>Acta PDF</span>
          </button>
        </div>
      </header>

      <main class="view-container" id="viewContainer">
        <!-- Rendered dynamically by app.js -->
      </main>

      <!-- Floating Manual Match Bar (visible when >=1 movement selected in Mesa) -->
      <div class="match-bar" id="matchBar" hidden>
        <div class="match-bar-sums" id="matchBarSums"></div>
        <div class="match-bar-actions">
          <button class="btn btn-ghost btn-sm" id="btnClearSelection">Limpiar</button>
          <button class="btn btn-primary btn-sm" id="btnConfirmMatch">Conciliar Seleccionados</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL CONTAINER -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal-card" id="modalCard" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Modal</h2>
        <button class="icon-btn" id="btnCloseModal" aria-label="Cerrar">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <script src="/static/app.js"></script>
</body>
</html>
